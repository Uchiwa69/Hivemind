<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hivemind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Hivemind</h1>
    <nav class="tabs">
      <button type="button" class="tab-button active" data-tab="chat">Chat</button>
      <button type="button" class="tab-button" data-tab="memory">Mémoire</button>
    </nav>
    <div class="cli-status">
      <ul id="cli-status-list"></ul>
      <button type="button" id="refresh-clis">Rafraîchir</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Historique</h2>
      <ul id="history-list" class="history-list"></ul>
    </aside>

    <main class="main">
      <section id="tab-chat" class="tab">
        <form id="ask-form" class="ask-form">
          <textarea id="prompt" rows="4" placeholder="Votre prompt… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)" required></textarea>
          <div class="ask-actions">
            <label>CLI cible
              <select id="cli-select"></select>
            </label>
            <button type="submit" id="send">Envoyer</button>
          </div>
        </form>

        <div id="result"></div>
      </section>

      <section id="tab-memory" class="tab" hidden>
        <h2>Mémoire commune</h2>
        <p class="hint">Écrite une fois ici, en Markdown, puis recopiée dans CLAUDE.md, AGENTS.md et GEMINI.md.</p>
        <textarea id="memory-editor" class="memory-editor" spellcheck="false" placeholder="# Contexte du projet&#10;&#10;- Conventions, décisions, informations à partager avec toutes les IA…"></textarea>
        <div class="ask-actions">
          <button type="button" id="memory-save" class="primary">Enregistrer</button>
          <span id="memory-status" class="status"></span>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
