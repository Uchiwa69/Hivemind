<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hivemind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Hivemind</h1>
    <nav class="tabs">
      <button type="button" class="tab-button active" data-tab="chat">Chat</button>
      <button type="button" class="tab-button" data-tab="memory">Mémoire</button>
    </nav>
    <div class="cli-status">
      <ul id="cli-status-list"></ul>
      <button type="button" id="refresh-clis">Rafraîchir</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Historique</h2>
      <ul id="history-list" class="history-list"></ul>
    </aside>

    <main class="main">
      <div id="sim-banner" class="sim-banner" hidden>
        <span>⚠ Panne de Claude Code simulée (réglage de démo) : chaque appel à Claude Code échoue volontairement.</span>
        <button type="button" id="sim-off">Désactiver</button>
      </div>

      <form id="workdir-form" class="workdir-bar">
        <label for="workdir">Dossier de travail</label>
        <input type="text" id="workdir" placeholder="C:\Users\moi\projets\mon-projet" spellcheck="false">
        <button type="submit">Valider</button>
        <span id="workdir-status" class="status"></span>
      </form>

      <div class="options-bar">
        <label class="toggle" title="Si la CLI choisie échoue (quota, non connectée, absente, délai, plantage), le prompt part vers la suivante"><input type="checkbox" id="fallback-toggle"> Bascule automatique</label>
        <span class="order-label">Ordre :</span>
        <ol id="fallback-order" class="fallback-order"></ol>
        <label class="sim-toggle"><input type="checkbox" id="simulate-toggle"> Simuler une panne de Claude Code</label>
        <span id="options-status" class="status"></span>
      </div>

      <section id="tab-chat" class="tab">
        <form id="ask-form" class="ask-form">
          <textarea id="prompt" rows="4" placeholder="Votre prompt… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)" required></textarea>
          <div class="ask-actions">
            <label class="toggle"><input type="checkbox" id="compare-toggle"> Comparer</label>
            <label id="single-cli">CLI cible
              <select id="cli-select"></select>
            </label>
            <div id="compare-clis" class="compare-clis" hidden></div>
            <button type="submit" id="send">Envoyer</button>
          </div>
        </form>

        <div id="result"></div>
      </section>

      <section id="tab-memory" class="tab" hidden>
        <h2>Mémoire commune</h2>
        <p class="hint">Écrite une fois ici, en Markdown, puis recopiée dans CLAUDE.md, AGENTS.md et GEMINI.md.</p>
        <textarea id="memory-editor" class="memory-editor" spellcheck="false" placeholder="# Contexte du projet&#10;&#10;- Conventions, décisions, informations à partager avec toutes les IA…"></textarea>
        <div class="ask-actions">
          <button type="button" id="memory-save" class="primary">Enregistrer</button>
          <button type="button" id="memory-sync">Synchroniser</button>
          <span id="memory-status" class="status"></span>
        </div>
        <ul id="sync-results" class="sync-results"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
